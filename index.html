<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員管理システム — ニューロン麻雀スクール神戸校</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif;background:#f8f7f2;color:#2c2c2a;font-size:14px}
header{background:#fff;border-bottom:1px solid #e0ddd4;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
header h1{font-size:17px;font-weight:700;color:#2c2c2a}
.badge{background:#E1F5EE;color:#085041;font-size:12px;padding:3px 10px;border-radius:20px;font-weight:700}
.school-name{font-size:12px;color:#999;margin-left:auto}
.container{padding:16px 20px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid #d3d1c7;border-radius:8px;font-size:14px;background:#fff;outline:none;font-family:inherit}
.search-wrap input:focus{border-color:#1D9E75;box-shadow:0 0 0 2px rgba(29,158,117,0.12)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa;font-size:15px}
select{padding:8px 10px;border:1px solid #d3d1c7;border-radius:8px;font-size:13px;background:#fff;font-family:inherit;color:#2c2c2a;outline:none;cursor:pointer}
select:focus{border-color:#1D9E75}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.stat{background:#fff;border:1px solid #e8e6de;border-radius:8px;padding:10px 14px}
.stat-val{font-size:24px;font-weight:700;color:#2c2c2a}
.stat-lbl{font-size:11px;color:#999;margin-top:2px}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #e0ddd4;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 10px;background:#f4f3ee;color:#666;font-weight:700;text-align:left;white-space:nowrap;border-bottom:1px solid #e0ddd4;cursor:pointer;user-select:none;font-size:12px}
th:hover{background:#eceae3;color:#333}
td{padding:8px 10px;border-bottom:1px solid #f0eee8;color:#2c2c2a;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf6}
.day-dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:#9FE1CB;color:#085041;font-size:11px;font-weight:700;text-align:center;line-height:22px}
.day-empty{display:inline-block;width:22px;height:22px;border-radius:50%;background:#f0eee8;color:#ccc;font-size:11px;text-align:center;line-height:22px}
.day-tri{background:#FAC775;color:#633806}
.stars{color:#BA7517;letter-spacing:-1px;font-size:13px}
.koza-chip{display:inline-block;background:#EEEDFE;color:#3C3489;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;margin:1px}
.no-result{padding:3rem;text-align:center;color:#aaa;font-size:14px}
.pagination{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.pagination button{min-width:34px;height:34px;padding:0 8px;border:1px solid #d3d1c7;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#2c2c2a;transition:background 0.1s}
.pagination button:hover:not(:disabled){background:#f0eee8}
.pagination button:disabled{opacity:0.35;cursor:default}
.pagination button.active{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:700}
.page-info{font-size:13px;color:#999;margin-left:auto}
.detail-btn{background:none;border:1px solid #d3d1c7;cursor:pointer;color:#1D9E75;font-size:12px;padding:3px 9px;border-radius:5px;font-family:inherit;font-weight:600}
.detail-btn:hover{background:#E1F5EE;border-color:#1D9E75}
/* モーダル */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.48);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;padding:1.5rem;max-width:520px;width:100%;max-height:92vh;overflow-y:auto}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.2rem;gap:12px}
.modal-name{font-size:20px;font-weight:700}
.modal-furi{color:#2c2c2a;font-size:13px;margin-top:3px}
.modal-close{background:none;border:1px solid #d3d1c7;cursor:pointer;font-size:18px;color:#999;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:#f0eee8}
.modal-section{margin-bottom:12px}
.modal-section-title{font-size:11px;font-weight:700;color:#1D9E75;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #E1F5EE}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.modal-item{padding:9px 12px;background:#f8f7f2;border-radius:8px}
.modal-item-lbl{font-size:10px;color:#999;margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
.modal-item-val{font-size:13px;color:#2c2c2a;font-weight:600}
.modal-item.full{grid-column:1/-1}
.days-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.days-row span{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:700}
.koza-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.koza-tag{display:inline-block;background:#EEEDFE;color:#3C3489;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.koza-none{font-size:13px;color:#bbb;margin-top:6px}
/* スマホ */
@media(max-width:600px){
  header{padding:10px 14px}
  .container{padding:10px 12px}
  .controls{gap:6px}
  .stats{grid-template-columns:repeat(2,1fr)}
  table{font-size:12px}
  th,td{padding:6px 7px}
  .modal{padding:1.2rem}
  .modal-grid{grid-template-columns:1fr}
}
</style>
</head>

const DAYS=[['mon','月'],['ka','火'],['sui','水'],['moku','木'],['kin','金'],['do','土'],['nichi','日']];
const PER_PAGE=30;
let filtered=[...DATA];
let sortKey='no';
let sortAsc=true;
let page=1;

function dayCell(val,label){
  if(val==='〇')return`<span class="day-dot">${label}</span>`;
  if(val==='△')return`<span class="day-dot day-tri">${label}</span>`;
  return`<span class="day-empty">${label}</span>`;
}
function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n);}

function getFiltered(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const koza=document.getElementById('filter-koza').value;
  const kubun=document.getElementById('filter-kubun').value;
  const day=document.getElementById('filter-day').value;
  const janryoku=document.getElementById('filter-janryoku').value;
  const jukko=document.getElementById('filter-jukko').value;
  return DATA.filter(m=>{
    if(q&&!(m.name+m.furigana+m.jusho).toLowerCase().includes(q))return false;
    if(koza&&m.koza!==koza)return false;
    if(kubun&&m.kubun!==kubun)return false;
    if(day&&m[day]!=='〇')return false;
    if(janryoku&&m.janryoku!==parseInt(janryoku))return false;
    if(jukko&&!m.kozaList.includes(jukko))return false;
    return true;
  });
}

function sort(key){
  if(sortKey===key)sortAsc=!sortAsc;
  else{sortKey=key;sortAsc=true;}
  render();
}

function render(){
  filtered=getFiltered().sort((a,b)=>{
    let va=a[sortKey],vb=b[sortKey];
    if(['nenrei','janryoku','no'].includes(sortKey)){va=parseInt(va)||0;vb=parseInt(vb)||0;}
    if(va<vb)return sortAsc?-1:1;
    if(va>vb)return sortAsc?1:-1;
    return 0;
  });
  document.getElementById('count-badge').textContent=filtered.length+'名';
  updateStats();
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(page>totalPages)page=1;
  const slice=filtered.slice((page-1)*PER_PAGE,page*PER_PAGE);
  const tbody=document.getElementById('tbody');
  const noRes=document.getElementById('no-result');
  if(!slice.length){tbody.innerHTML='';noRes.style.display='block';}
  else{
    noRes.style.display='none';
    tbody.innerHTML=slice.map(m=>`
      <tr>
        <td style="color:#888;font-size:12px">${m.no}</td>
        <td style="font-weight:700;white-space:nowrap">${m.name}</td>
        <td style="color:#2c2c2a;font-size:12px;white-space:nowrap">${m.furigana}</td>
        <td class="stars" title="${m.janryoku}段">${stars(m.janryoku)}</td>
        <td style="font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${m.keiken}">${m.keiken||'-'}</td>
        <td style="text-align:right">${m.nenrei&&m.nenrei!=='#VALUE!'?m.nenrei+'歳':'-'}</td>
        <td style="font-size:12px;white-space:nowrap;color:#999">${m.torokuDate}</td>
        <td style="font-size:12px;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis" title="${m.shokaisha}">${m.shokaisha||'-'}</td>
        <td style="font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${m.jusho}">${m.jusho||'-'}</td>
        ${DAYS.map(([k,l])=>`<td style="text-align:center;padding:5px 3px">${dayCell(m[k],l)}</td>`).join('')}
        <td><button class="detail-btn" onclick="showDetail(${m.no})">詳細</button></td>
      </tr>`).join('');
  }
  renderPagination(totalPages);
}

function updateStats(){
  const keizoku=filtered.filter(m=>m.kubun==='継続').length;
  const kodomo=filtered.filter(m=>m.koza&&m.koza.includes('子供')).length;
  const jukkoCount=filtered.filter(m=>m.kozaList&&m.kozaList.length>0).length;
  const shoukai=filtered.filter(m=>m.kikkake==='会員紹介').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-val">${filtered.length}</div><div class="stat-lbl">絞込結果</div></div>
    <div class="stat"><div class="stat-val">${keizoku}</div><div class="stat-lbl">継続会員</div></div>
    <div class="stat"><div class="stat-val">${jukkoCount}</div><div class="stat-lbl">講座受講済</div></div>
    <div class="stat"><div class="stat-val">${shoukai}</div><div class="stat-lbl">会員紹介</div></div>`;
}

function renderPagination(total){
  const el=document.getElementById('pagination');
  if(total<=1){el.innerHTML='';return;}
  let html=`<button onclick="changePage(${page-1})" ${page===1?'disabled':''}>◀</button>`;
  const s=Math.max(1,page-2),e=Math.min(total,page+2);
  if(s>1)html+=`<button onclick="changePage(1)">1</button>${s>2?'<span style="padding:0 4px;color:#bbb">…</span>':''}`;
  for(let i=s;i<=e;i++)html+=`<button onclick="changePage(${i})" class="${i===page?'active':''}">${i}</button>`;
  if(e<total)html+=`${e<total-1?'<span style="padding:0 4px;color:#bbb">…</span>':''}<button onclick="changePage(${total})">${total}</button>`;
  html+=`<button onclick="changePage(${page+1})" ${page===total?'disabled':''}>▶</button>`;
  html+=`<span class="page-info">${(page-1)*PER_PAGE+1}〜${Math.min(page*PER_PAGE,filtered.length)} / ${filtered.length}名</span>`;
  el.innerHTML=html;
}

function changePage(p){
  const total=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(p<1||p>total)return;
  page=p;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showDetail(no){
  const m=DATA.find(x=>x.no===no);
  if(!m)return;
  const kozaHTML=m.kozaList&&m.kozaList.length>0
    ?`<div class="koza-list">${m.kozaList.map(k=>`<span class="koza-tag">✓ ${k}</span>`).join('')}</div>`
    :`<div class="koza-none">受講履歴なし</div>`;
  document.getElementById('modal').innerHTML=`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal">
        <div class="modal-header">
          <div>
            <div class="modal-name">No.${m.no}　${m.name}</div>
            <div class="modal-furi">${m.furigana}</div>
          </div>
          <button class="modal-close" onclick="closeModal(null)">✕</button>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">基本情報</div>
          <div class="modal-grid">
            <div class="modal-item"><div class="modal-item-lbl">区分</div><div class="modal-item-val">${m.kubun||'-'}</div></div>
            <div class="modal-item"><div class="modal-item-lbl">雀力</div><div class="modal-item-val stars">${stars(m.janryoku)} (${m.janryoku}段)</div></div>
            <div class="modal-item"><div class="modal-item-lbl">コース</div><div class="modal-item-val">${m.koza||'-'}</div></div>
            <div class="modal-item"><div class="modal-item-lbl">年齢</div><div class="modal-item-val">${m.nenrei&&m.nenrei!=='#VALUE!'?m.nenrei+'歳':'-'}</div></div>
            <div class="modal-item"><div class="modal-item-lbl">登録日</div><div class="modal-item-val">${m.torokuDate}</div></div>
            <div class="modal-item"><div class="modal-item-lbl">経験</div><div class="modal-item-val">${m.keiken||'-'}</div></div>
            <div class="modal-item"><div class="modal-item-lbl">きっかけ</div><div class="modal-item-val">${m.kikkake||'-'}</div></div>
            <div class="modal-item"><div class="modal-item-lbl">紹介者</div><div class="modal-item-val">${m.shokaisha?'No.'+m.shokaishaNo+'　'+m.shokaisha:'-'}</div></div>
            <div class="modal-item full"><div class="modal-item-lbl">住所</div><div class="modal-item-val">${m.jusho||'-'}</div></div>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">受講講座</div>
          ${kozaHTML}
        </div>

        <div class="modal-section">
          <div class="modal-section-title">来校可能曜日</div>
          <div class="days-row">
            ${DAYS.map(([k,l])=>{
              const v=m[k];
              if(v==='〇')return`<span style="background:#9FE1CB;color:#085041">${l}</span>`;
              if(v==='△')return`<span style="background:#FAC775;color:#633806">${l}</span>`;
              return`<span style="background:#f0eee8;color:#ccc">${l}</span>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('modal').style.display='block';
}

function closeModal(e){
  if(e===null||e.target.classList.contains('modal-overlay')){
    document.getElementById('modal').style.display='none';
  }
}

render();
</script>
</body>
</html>
